upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8000;
}

server_tokens off;

# Cache-Control per path. Set through a map so the server-level add_header list (security
# headers) stays in force; an add_header inside a location would silently drop them.
#   /assets/  Vite output, file names carry a content hash → cache for a year
#   images, videos, icons  fixed names that may be replaced → one day
#   pages     revalidate every time so a deploy shows up at once
#   /api, /health  left to the backend (empty value = header not sent)
map $uri $cache_control {
    ~^/(api|health)                                         "";
    ~^/assets/                                              "public, max-age=31536000, immutable";
    ~\.(png|jpe?g|webp|gif|svg|ico|mp4|webm|woff2?)$        "public, max-age=86400";
    default                                                 "no-cache";
}

# HTTP -> HTTPS 리다이렉트
server {
    listen 80;
    server_name juhwan.dev www.juhwan.dev;
    return 301 https://$host$request_uri;
}

# HTTPS 서버
server {
    listen 443 ssl;
    server_name juhwan.dev www.juhwan.dev;

    # SSL 인증서 (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/juhwan.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/juhwan.dev/privkey.pem;

    # SSL 보안 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header Content-Security-Policy "upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $cache_control;

    # The frontend container (`serve`) sends files uncompressed; the main bundle is ~575 KB raw.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/xml text/xml image/svg+xml text/plain;

    # Frontend (Next.js)
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API (FastAPI)
    location /api {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://backend/health;
    }
}
