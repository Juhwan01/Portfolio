<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Default SEO (react-helmet-async will override per page) -->
    <title>정주환 | AI Engineer</title>
    <meta name="description" content="AI 엔지니어 정주환. 에이전트를 실서비스로 내보낸 프로젝트와 경력을 소개합니다." />
    <meta name="author" content="정주환" />
    <link rel="canonical" href="https://juhwan.dev" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="정주환 | AI Engineer" />
    <meta property="og:description" content="AI 엔지니어 정주환. 에이전트를 실서비스로 내보낸 프로젝트와 경력을 소개합니다." />
    <meta property="og:image" content="https://juhwan.dev/og.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="정주환, 에이전트를 실서비스로 내보내는 AI 엔지니어" />
    <meta property="og:url" content="https://juhwan.dev" />
    <meta property="og:site_name" content="정주환 포트폴리오" />
    <meta property="og:locale" content="ko_KR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="정주환 | AI Engineer" />
    <meta name="twitter:description" content="AI 엔지니어 정주환. 에이전트를 실서비스로 내보낸 프로젝트와 경력을 소개합니다." />
    <meta name="twitter:image" content="https://juhwan.dev/og.png?v=2" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#ffffff" />
    <!-- Theme: light unless the visitor chose dark (saved by the dock toggle). Set before paint to avoid a flash. -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>

    <!-- Fonts: Pretendard (Korean + Latin) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
