# 첫 화면 "기술". 대표 기술만, 중요한 순서로 적는다. 화면에는 배지 한 줄로 보인다.
# 라이브러리 단위의 세부 항목(scikit-learn, XGBoost, pandas 등)은 여기 말고 각 프로젝트의 tags에 둔다.
# 배지에 마우스를 올리면 그 기술을 쓴 프로젝트가 보인다. 프로젝트 tags에서 자동으로 모은다(대소문자 무시).
#   match: 이 기술로 칠 태그 이름들. 없으면 name 하나만 맞춘다.
# 예전 DB 원본은 _backup/2026-11-10/skills.json.

items:
  - name: Python
  - name: LangGraph
  - name: LangChain
  - name: OpenAI API
    match: [OpenAI, GPT-4]
  - name: MCP
  - name: Langfuse
  - name: PyTorch
  - name: Hugging Face
  - name: FastAPI
  - name: PostgreSQL
  - name: Redis
  - name: Qdrant
  - name: ChromaDB
  - name: AWS
    match: [AWS, AWS EC2, AWS RDS, AWS S3, AWS Lightsail]
  - name: Docker
